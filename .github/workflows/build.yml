name: Node.js CI

on:
  workflow_call:
    inputs:
      release-tag:
        description: Release tag that must match the package version.
        required: false
        default: ''
        type: string
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        node-version: ['22', '24', '26']

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: node --run test
      - name: Benchmark pull request performance
        if: github.event_name == 'pull_request' && matrix.node-version == '26'
        env:
          BENCHMARK_BASELINE: ${{ github.event.pull_request.base.sha }}
          BENCHMARK_PR_NUMBER: ${{ github.event.number }}
        run: |
          node --run bench -- --baseline "$BENCHMARK_BASELINE" --output benchmark-result.json
          printf '%s\n' "$BENCHMARK_PR_NUMBER" > benchmark-pr-number.txt
      - name: Upload performance benchmark
        if: github.event_name == 'pull_request' && matrix.node-version == '26'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: password-generator-performance
          path: |
            benchmark-result.json
            benchmark-pr-number.txt
          if-no-files-found: error
          retention-days: 1
      - run: npm pack --dry-run
      - name: Verify release tag
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: test "$RELEASE_TAG" = "v$(npm pkg get version | tr -d '\"')"
